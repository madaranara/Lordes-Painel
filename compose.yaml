services:
  painel:
    build: .
    init: true
    restart: unless-stopped
    environment:
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no arquivo .env}
      LORDES_BEHIND_REVERSE_PROXY: 'true'
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      TZ: America/Sao_Paulo
    volumes:
      - dados:/app/.data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health').then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 30s
      timeout: 5s
      start_period: 15s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      painel:
        condition: service_healthy
    environment:
      LORDES_HOST: ${LORDES_HOST:?Defina LORDES_HOST no arquivo .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificados:/data
      - configuracao_caddy:/config
volumes:
  dados:
  certificados:
  configuracao_caddy:
